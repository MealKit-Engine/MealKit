# MealKit CI build matrix (docs/ROADMAP.md stage 1 "CI build matrix", docs repo "Engine development > Testing").
# On every commit, builds Windows MSVC (Release, Editor) and clang-cl, Linux x64 Clang headless and the Linux X11 + Vulkan front end (no GPU: build, tests and mp_test only), and macOS ARM64 Clang headless,
# runs tools/ci_test.ps1 (unit tests, fixed input recording replay, headless mp_test) in each build, then
# tools/ci_compare.ps1 checks that detmath-bits and per-tick hashes match across all builds. Any difference fails.
# The Windows MSVC and Linux front end jobs also build the shipping export of both samples: it fails over the 5 MB executable budget,
# warns above 90% of it, and tools/size_report.ps1 prints the size per library and module (job summary and artifact).
# The runners have no GPU, so screen capture and shadow/rewind checks stay in local tools/check.ps1. No Steam/EOS SDK, so the "none" backend is built.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            config: Release
            checks: true
          - name: windows-clang-cl
            config: ClangCL
          - name: windows-msvc-editor
            config: Editor
            no_headless: true
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the locked samples (samples.lock)
        shell: pwsh
        run: tools/sample.ps1 sync
      - name: Build (${{ matrix.config }})
        shell: cmd
        run: call build.bat ${{ matrix.config }}
      - name: Test
        shell: powershell
        run: >
          tools\ci_test.ps1 -Config ${{ matrix.config }} -Name ${{ matrix.name }} -Out ci-out/${{ matrix.name }}
          ${{ matrix.no_headless && '-NoHeadless' || '' }}
      - name: Editor strings (check_strings)
        if: matrix.checks
        shell: powershell
        run: tools\check_strings.ps1
      - name: Platform layer (check_platform)
        if: matrix.checks
        shell: powershell
        run: tools\check_platform.ps1
      - name: Engine modules (check_modules)
        if: matrix.checks
        shell: powershell
        run: tools\check_modules.ps1
      - name: Project layout and notices (check_layout, gen_notices -Check)
        if: matrix.checks
        shell: powershell
        run: |
          tools\check_layout.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          tools\gen_notices.ps1 -Check
      - name: Shipping export of both samples (5 MB executable budget)
        if: matrix.checks
        shell: cmd
        run: call build.bat Export
      - name: Executable size per library and module
        if: ${{ !cancelled() && matrix.checks }}
        shell: powershell
        run: tools\size_report.ps1 -Name sandbox,coop -Out ci-out/${{ matrix.name }}/size-report.txt
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.name }}
          path: ci-out/${{ matrix.name }}
          if-no-files-found: ignore

  headless:
    name: Headless ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-clang
            os: ubuntu-24.04
          - name: macos-arm64-clang
            os: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the locked samples (samples.lock)
        shell: pwsh
        run: tools/sample.ps1 sync
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true
      - name: Build (sample headless exes, mealkit_tests)
        shell: pwsh
        run: ./build.ps1 Headless -Target sandbox_headless, coop_headless, mealkit_tests # the same build script as Windows (tools/build.ps1, clang)
      - name: Test
        shell: pwsh
        run: tools/ci_test.ps1 -Config Headless -Name ${{ matrix.name }} -Out ci-out/${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.name }}
          path: ci-out/${{ matrix.name }}
          if-no-files-found: ignore

  linux-frontend:
    name: Linux front end (X11 + Vulkan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the locked samples (samples.lock)
        shell: pwsh
        run: tools/sample.ps1 sync
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libx11-dev libxext-dev libxi-dev libxrandr-dev
      - name: Build (the Linux game exe, headless exes, mealkit_tests)
        shell: pwsh
        run: ./build.ps1 Release -Target sandbox, sandbox_headless, coop_headless, mealkit_tests # the X11 + Vulkan front end (MEALKIT_LINUX_FRONTEND=ON through tools/build.ps1)
      - name: "Build (Editor: mealkit + sample game libraries)"
        shell: pwsh
        run: ./build.ps1 Editor
      - name: Test (the same replays and hashes as the headless job)
        shell: pwsh
        run: tools/ci_test.ps1 -Config Release -Name linux-x64-frontend -Out ci-out/linux-x64-frontend
      - name: Multiplayer between Linux peers (mp_test)
        shell: pwsh
        run: tools/mp_test.ps1 -Headless -Clients 3 -Ticks 900
      - name: Shipping export of both samples (5 MB executable budget)
        shell: pwsh
        run: ./build.ps1 Export
      - name: Executable size per library and module
        if: ${{ !cancelled() }}
        shell: pwsh
        run: tools/size_report.ps1 -Name sandbox,coop -Out ci-out/linux-x64-frontend/size-report.txt
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: linux-x64-frontend
          path: ci-out/linux-x64-frontend
          if-no-files-found: ignore

  compare:
    name: Compare hashes across builds
    needs: [windows, headless, linux-frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ci-results
      - name: detmath-bits and replay tick hashes
        shell: pwsh
        run: >
          tools/ci_compare.ps1 -Dir ci-results -Reference windows-msvc
          -Expect windows-msvc,windows-clang-cl,windows-msvc-editor,linux-x64-clang,linux-x64-frontend,macos-arm64-clang
