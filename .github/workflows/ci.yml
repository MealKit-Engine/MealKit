# MealKit CI build matrix (docs/ROADMAP.md stage 1 "CI build matrix", docs repo "Engine development > Testing").
# On every commit, builds Windows MSVC (Release, Editor) and clang-cl plus Linux x64 and macOS ARM64 Clang headless,
# runs tools/ci_test.ps1 (unit tests, fixed input recording replay, headless mp_test) in each build, then
# tools/ci_compare.ps1 checks that detmath-bits and per-tick hashes match across all builds. Any difference fails.
# The runners have no GPU, so screen capture and shadow/rewind checks stay in local tools/check.ps1. No Steam/EOS SDK, so the "none" backend is built.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            config: Release
            bin: build/Release/bin
            checks: true
          - name: windows-clang-cl
            config: ClangCL
            bin: build/ClangCL/bin
          - name: windows-msvc-editor
            config: Editor
            bin: build/Editor/bin
            no_headless: true
    steps:
      - uses: actions/checkout@v4
      - name: Build (${{ matrix.config }})
        shell: cmd
        run: call build.bat ${{ matrix.config }}
      - name: Test
        shell: powershell
        run: >
          tools\ci_test.ps1 -Bin ${{ matrix.bin }} -Name ${{ matrix.name }} -Out ci-out/${{ matrix.name }}
          ${{ matrix.no_headless && '-NoHeadless' || '' }}
      - name: Editor strings (check_strings)
        if: matrix.checks
        shell: powershell
        run: tools\check_strings.ps1
      - name: Platform layer (check_platform)
        if: matrix.checks
        shell: powershell
        run: tools\check_platform.ps1
      - name: Engine layers (check_layers)
        if: matrix.checks
        shell: powershell
        run: tools\check_layers.ps1
      - name: Project layout and notices (check_layout, gen_notices -Check)
        if: matrix.checks
        shell: powershell
        run: |
          tools\check_layout.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          tools\gen_notices.ps1 -Check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.name }}
          path: ci-out/${{ matrix.name }}
          if-no-files-found: ignore

  headless:
    name: Headless ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-clang
            os: ubuntu-24.04
          - name: macos-arm64-clang
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true
      - name: Configure
        run: >
          cmake -S . -B build/Headless -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build (sandbox_headless, mealkit_tests)
        run: cmake --build build/Headless --target sandbox_headless mealkit_tests -- -k 0 # see all errors at once
      - name: Test
        shell: pwsh
        run: tools/ci_test.ps1 -Bin build/Headless/bin -Name ${{ matrix.name }} -Out ci-out/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.name }}
          path: ci-out/${{ matrix.name }}
          if-no-files-found: ignore

  compare:
    name: Compare hashes across builds
    needs: [windows, headless]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ci-results
      - name: detmath-bits and replay tick hashes
        shell: pwsh
        run: >
          tools/ci_compare.ps1 -Dir ci-results -Reference windows-msvc
          -Expect windows-msvc,windows-clang-cl,windows-msvc-editor,linux-x64-clang,macos-arm64-clang
